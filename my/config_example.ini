[Data]
data_path = my/test_data.csv
targets = Target1,Target2,Target3,Target4
# supervised binary classification problem: one indipendent model for each class of antibiotic
continuous_features = var1,var2,var5,var6
# these variables will be transformed with StandardScaler (from sklearn) as most models requires: mean=0, sd=1
# all the other variables (=categoricals) will be subjected to OHE


[Metadata] # optional
# group_column = PatientID  # Column for grouping (prevents data leakage in CV)
# temporal_column = collection_date  # Date column for temporal validation
# subgroup_columns = ward, sex  # Columns for subgroup performance analysis (comma-separated)


[Pipeline]
# Available models: LR, MLP, XGB, RF, CatBoost, TabPFN, RBF_SVC, Linear_SVC, KNN
 
# nested CV: 
# - outer CV chooses best model
# - inner CV chooses best hyperparameters combination (tuning on training set) without seeing the original test set for each iteration;
# oss: the hyperparameter is chosen if the AUROC metrics of the trained and tested model (with the inner folds) is the highest one
# then, with the selected parameter, the model is trained and tested on the unseen test set
# the process is repeated for each iteration of the outer CV (k) 
outer_folds=3
inner_folds=2
# Number of repetitions for outer CV (1 = standard CV, >1 = repeated CV)
outer_cv_repeats = 1

models = LR
# if more models are to be evaluated, the entire nested CV will be repeated for each model to assess its performance;


# Calibrate decision threshold using Youden's J statistic (optimizes Sensitivity + Specificity - 1)
calibrate_threshold = true

# Threshold optimization method: 'auto' (default: oof if n<1000, cv otherwise), 'oof' (out-of-fold), or 'cv' (TunedThresholdClassifierCV)
threshold_method = auto

# Threshold optimization objective: youden (default), f1, f2, cost_sensitive
threshold_objective = youden

# Cost weights for cost_sensitive objective (VME = false susceptible, ME = false resistant)
vme_cost = 1.0
me_cost = 1.0

# Post-hoc probability calibration using CalibratedClassifierCV
calibrate_probabilities = true
# Calibration method: sigmoid (Platt scaling) or isotonic
probability_calibration_method = sigmoid
# CV folds for probability calibration (must be >= 2)
probability_calibration_cv = 5
# Confidence level for bootstrap CIs (between 0.5 and 1.0, default: 0.95)
# confidence_level = 0.95
# Number of bootstrap resamples for CIs (>= 100, default: 1000)
# n_bootstrap = 1000


[Uncertainty]
# Miscoverage rate for conformal prediction (default 0.1 = 90% coverage)
alpha = 0.1

[Reproducibility]
seed = 42

[Log]
# Verbosity levels: 0 = no log, 1 = basic logging, 2 = detailed logging
verbosity = 2
log_basename = respredai.log

[Resources]
# Number of parallel jobs (-1 uses all available cores)
n_jobs = -1

[ModelSaving]
# Enable model saving for resuming interrupted runs
enable = true
# Compression level for saved models (1-9, higher = more compression but slower)
compression = 3

[Imputation]
# Missing data imputation method: none, simple, knn, iterative
method = none
# Strategy for simple imputation: mean, median, most_frequent
strategy = mean
# Number of neighbors for KNN imputation
n_neighbors = 5
# Estimator for iterative imputation: bayesian_ridge, random_forest (MissForest-style)
estimator = bayesian_ridge

[Preprocessing]
# Comment out or omit to disable (keep all categories)
# ohe_min_frequency = 0.05

[Output]
out_folder = my/out_run_LR_3x2_new_int/

